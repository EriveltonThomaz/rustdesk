name: Build Suporte PQD (Linux x64 .deb)

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
  RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
  API_SERVER: ${{ secrets.API_SERVER }}
  APP_NAME: ${{ secrets.APP_NAME }}

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-linux-x64:
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm qemu-user-static python3-pip

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - name: Save Rust toolchain version
        run: |
          RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
          echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV

      - name: Disable rust bridge build
        run: |
          sed -i "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Apply PQD Informatica branding and server config
        env:
          CFG_RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          CFG_RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          CFG_API_SERVER: ${{ secrets.API_SERVER }}
          CFG_APP_NAME: ${{ secrets.APP_NAME }}
        run: |
          pip3 install Pillow
          python3 - <<'PY'
          import base64, os, re
          from PIL import Image

          # 1. Generate Linux PNG icons from res/icon.png
          img = Image.open("res/icon.png").convert("RGBA")
          for path, size in [
              ("res/icon.png", (512, 512)),
              ("res/logo.png", (256, 256)),
              ("res/256x256@2x.png", (512, 512)),
              ("res/128x128@2x.png", (256, 256)),
              ("res/128x128.png", (128, 128)),
              ("res/64x64.png", (64, 64)),
              ("res/32x32.png", (32, 32)),
          ]:
              img.resize(size, Image.LANCZOS).save(path, format="PNG")

          with open("res/icon.png", "rb") as f:
              b64 = base64.b64encode(f.read()).decode("ascii")
          svg_wrapper = (
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">'
              f'<image width="512" height="512" href="data:image/png;base64,{b64}"/>'
              '</svg>'
          )
          for svg_target in [
              "flutter/assets/icon.svg",
              "res/logo.svg",
              "res/logo-header.svg",
          ]:
              if os.path.exists(svg_target):
                  with open(svg_target, "w", encoding="utf-8") as f:
                      f.write(svg_wrapper)

          # 2. Patch libs/hbb_common/src/config.rs
          srv = os.environ["CFG_RENDEZVOUS_SERVER"].strip()
          pub = os.environ["CFG_RS_PUB_KEY"].strip()
          api = os.environ["CFG_API_SERVER"].strip()
          app = os.environ["CFG_APP_NAME"].strip()

          cfg_path = "libs/hbb_common/src/config.rs"
          with open(cfg_path, "r", encoding="utf-8") as f:
              txt = f.read()

          txt = re.sub(
              r'pub const RENDEZVOUS_SERVERS:\s*&\[&str\]\s*=\s*&\[[^\]]*\];',
              f'pub const RENDEZVOUS_SERVERS: &[&str] = &["{srv}"];',
              txt,
          )
          txt = re.sub(
              r'pub const RS_PUB_KEY:\s*&str\s*=\s*"[^"]*";',
              f'pub const RS_PUB_KEY: &str = "{pub}";',
              txt,
          )
          txt = re.sub(
              r'pub static ref PROD_RENDEZVOUS_SERVER:\s*RwLock<String>\s*=\s*RwLock::new\("[^"]*".to_owned\(\)\);',
              f'pub static ref PROD_RENDEZVOUS_SERVER: RwLock<String> = RwLock::new("{srv}".to_owned());',
              txt,
          )
          txt = re.sub(
              r'pub static ref APP_NAME:\s*RwLock<String>\s*=\s*RwLock::new\("[^"]*".to_owned\(\)\);',
              f'pub static ref APP_NAME: RwLock<String> = RwLock::new("{app}".to_owned());',
              txt,
          )
          if api and "https://api.rustdesk.com" in txt:
              txt = txt.replace("https://api.rustdesk.com", api)

          with open(cfg_path, "w", encoding="utf-8") as f:
              f.write(txt)

          # 3. Patch src/common.rs so get_api_server_ returns CFG_API_SERVER when api is empty
          common_path = "src/common.rs"
          if api and os.path.exists(common_path):
              with open(common_path, "r", encoding="utf-8") as f:
                  c_txt = f.read()
              c_txt = c_txt.replace("https://admin.rustdesk.com", api)
              marker = "    if !api.is_empty() {\n        return api.to_owned();\n    }"
              if marker in c_txt:
                  c_txt = c_txt.replace(
                      marker,
                      marker + f'\n    return "{api}".to_owned();',
                      1,
                  )
              with open(common_path, "w", encoding="utf-8") as f:
                  f.write(c_txt)
          PY

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          sudo apt-get install -y libva-dev
          $VCPKG_ROOT/vcpkg install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"

      - name: Build libdrmtap
        run: |
          sudo apt-get install -y meson ninja-build pkg-config libdrm-dev libegl1-mesa-dev libgles2-mesa-dev
          python3 - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("b", "build.py")
          b = importlib.util.module_from_spec(spec)
          sys.argv = ["build.py"]
          spec.loader.exec_module(b)
          print(f"::notice::built {b.build_libdrmtap_so()}")
          PY

      - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8
        name: Build rustdesk (.deb)
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          API_SERVER: ${{ secrets.API_SERVER }}
          APP_NAME: ${{ secrets.APP_NAME }}
        with:
          arch: x86_64
          distro: ubuntu18.04
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
            -e RENDEZVOUS_SERVER
            -e RS_PUB_KEY
            -e API_SERVER
            -e APP_NAME
          shell: /bin/bash
          install: |
            apt-get update -y
            apt-get install -y \
              build-essential clang cmake curl gcc git g++ \
              libayatana-appindicator3-dev libasound2-dev libclang-10-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
              libgtk-3-dev libpulse-dev libva-dev \
              libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
              libxdo-dev libxfixes-dev llvm-10-dev nasm ninja-build \
              pkg-config python3 rpm unzip wget xz-utils libssl-dev
            apt-get remove -y libopus-dev || true
          run: |
            git config --global --add safe.directory "*"
            pushd /opt
            wget -q -O rust.tar.gz "https://static.rust-lang.org/dist/rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu.tar.gz"
            tar -zxf rust.tar.gz && rm rust.tar.gz
            cd "rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu" && ./install.sh
            rm -rf "/opt/rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu"
            mkdir -p ~/.cargo/
            printf '[source.crates-io]\nregistry = "https://github.com/rust-lang/crates.io-index"\n' > ~/.cargo/config
            popd

            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            export DRMTAP_PREBUILT_DIR=/workspace/third_party/libdrmtap/build-pkg
            FEATURES=$(python3 ./build.py --flutter --drm --hwcodec --unix-file-copy-paste --print-features)
            cargo build --locked --lib --features "$FEATURES" --release
            rm -rf target/release/deps target/release/build ~/.cargo

            export PATH=/opt/flutter/bin:$PATH
            pushd /opt
            wget -q "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz"
            tar xf "flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz"
            if [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]]; then
              pushd /opt/flutter
              git apply /workspace/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true
              popd
            fi
            popd

            export CARGO_INCREMENTAL=0
            export DEB_ARCH=amd64
            python3 ./build.py --flutter --drm --hwcodec --unix-file-copy-paste --skip-cargo

            DEB_FOUND=$(ls -1 rustdesk*.deb | head -n 1)
            cp -f "$DEB_FOUND" /workspace/Suporte-PQD-x86_64.deb
            ls -lh /workspace/Suporte-PQD-x86_64.deb

      - name: Upload Suporte-PQD-x86_64.deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suporte-pqd-linux-x64
          path: ./Suporte-PQD-x86_64.deb
          if-no-files-found: error
